<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nota</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">Nota</h1>
        <button class="btn-icon" id="addFolderBtn" title="Nouveau dossier">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
        </button>
      </div>
      <div class="folders-list" id="foldersList"></div>
    </aside>
    <main class="main-content">
      <div class="tabs-bar" id="tabsBar"></div>
      <div class="editor-container">
        <div class="editor-toolbar" id="toolbar">
          <button class="btn-icon" title="Gras" data-command="bold"><strong>B</strong></button>
          <button class="btn-icon" title="Italique" data-command="italic"><em>I</em></button>
          <button class="btn-icon" title="Liste à puces" data-command="bulletList">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="9" y1="6" x2="20" y2="6"></line>
              <line x1="9" y1="12" x2="20" y2="12"></line>
              <line x1="9" y1="18" x2="20" y2="18"></line>
              <line x1="5" y1="6" x2="5" y2="6.01"></line>
              <line x1="5" y1="12" x2="5" y2="12.01"></line>
              <line x1="5" y1="18" x2="5" y2="18.01"></line>
            </svg>
          </button>
          <button class="btn-icon" title="Liste numérotée" data-command="orderedList">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="10" y1="6" x2="21" y2="6"></line>
              <line x1="10" y1="12" x2="21" y2="12"></line>
              <line x1="10" y1="18" x2="21" y2="18"></line>
              <path d="M4 6h1v4"></path>
              <path d="M4 10h2"></path>
              <path d="M6 18H4c0-1 3-2 3-3s-1-1.5-3-1"></path>
            </svg>
          </button>
          <div class="toolbar-divider"></div>
          <button class="btn-icon" title="Titre H1" data-command="heading1"><span style="font-size:16px;font-weight:700">H1</span></button>
          <button class="btn-icon" title="Titre H2" data-command="heading2"><span style="font-size:14px;font-weight:700">H2</span></button>
          <div class="toolbar-divider"></div>
          <button class="btn-icon" id="emojiBtn" title="Emoji">😊</button>
          <button class="btn-icon" id="tableBtn" title="Tableau">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </button>
          <div class="toolbar-divider"></div>
          <button class="btn-icon" id="clearBtn" title="Effacer mise en forme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18"></path>
              <path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"></path>
              <line x1="9" y1="6" x2="9" y2="3"></line>
              <line x1="15" y1="6" x2="15" y2="3"></line>
            </svg>
          </button>
        </div>
        <div class="emoji-picker" id="emojiPicker" style="display:none;">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <div class="editor" id="editor" contenteditable="true" data-placeholder="Commencez à écrire…"></div>
        <div class="status-bar">
          <span id="wordCount">0 mots</span>
          <span id="charCount">0 caractères</span>
        </div>
      </div>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
